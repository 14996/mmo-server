# MMO Server 运行配置
# 格式：key=value；# 后为注释。命令行 --ip/--port 会覆盖这里的值。

server.ip=0.0.0.0
server.port=9000

# 连接超过该时间没有任何数据往来则踢下线；踢线前会保存世界数据
net.heartbeat_timeout_ms=30000

# 单连接每秒最多允许的消息包数，超过后断连
net.max_packets_per_sec=300

# 游戏世界
game.save_interval_ms=30000
game.offline_retain_ms=60000
game.aoi_cell_size=8
